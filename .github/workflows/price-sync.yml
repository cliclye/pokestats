name: Price Sync

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production price sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$JOBS_SECRET" ]; then
            echo "Set APP_URL and JOBS_SECRET repo secrets"
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/jobs/run" \
            -H "Content-Type: application/json" \
            -H "x-jobs-secret: $JOBS_SECRET" \
            -d '{"job":"prices","setLimit":4}'
