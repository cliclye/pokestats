name: Web Signals Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scrape NowInStock + restock pages into Supabase
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${JOBS_SECRET:-}" ]; then
            echo "Set APP_URL and JOBS_SECRET repo secrets"
            exit 1
          fi
          curl -fsS --max-time 120 -X POST "$APP_URL/api/jobs/run" \
            -H "Content-Type: application/json" \
            -H "x-jobs-secret: $JOBS_SECRET" \
            -d '{"job":"signals"}'
          echo
          echo "Web signals auto-check complete"
